<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ModernQUAKE</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;color:#dff}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 0 8px #000}
  #cross{position:absolute;left:50%;top:50%;width:0;height:0}
  #cross i{position:absolute;background:#e9ffff;opacity:.92;border-radius:1px;box-shadow:0 0 0 1px rgba(0,0,0,.55)}
  #cross i:nth-child(1){left:-1px;top:-14px;width:2px;height:7px}
  #cross i:nth-child(2){left:-1px;top:7px;width:2px;height:7px}
  #cross i:nth-child(3){top:-1px;left:-14px;height:2px;width:7px}
  #cross i:nth-child(4){top:-1px;left:7px;height:2px;width:7px}
  #cross b{position:absolute;left:-1.5px;top:-1.5px;width:3px;height:3px;border-radius:50%;background:#7ffff0;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 6px #0ff}
  .stat{position:absolute;bottom:22px;font-weight:700;font-size:64px;letter-spacing:1px;line-height:1}
  .stat small{display:block;font-size:13px;letter-spacing:3px;opacity:.7;font-weight:600}
  #hp{left:40px;color:#ffd24a}
  #ar{left:200px;color:#ff9a3c}
  #speed{right:40px;color:#7ffff0}
  #medal{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:4px;opacity:.75}
  #msg{position:absolute;top:38%;left:50%;transform:translateX(-50%);font-size:22px;letter-spacing:3px;color:#fff;opacity:0;transition:opacity .4s}
  #net{position:absolute;top:18px;right:24px;text-align:right;font-size:14px;letter-spacing:2px;line-height:1.5;color:#bfefff}
  #net b{color:#ffd24a} #net .me{color:#7ffff0}
  #online{margin-top:18px;display:flex;gap:8px;align-items:center;cursor:default}
  #online input{background:rgba(10,20,40,.7);border:1px solid #5ee7ff55;color:#e9ffff;padding:8px 10px;border-radius:6px;font:600 15px inherit;letter-spacing:2px;text-transform:uppercase;width:130px;text-align:center}
  #online button{background:linear-gradient(90deg,#3ee8b0,#5ea7ff);color:#04101c;border:0;border-radius:6px;padding:9px 16px;font:700 14px inherit;letter-spacing:2px;cursor:pointer}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,10,.55);cursor:pointer;z-index:5;backdrop-filter:blur(3px)}
  #start h1{font-size:72px;letter-spacing:12px;margin:0;background:linear-gradient(90deg,#6bffb8,#5ee7ff,#c27bff);-webkit-background-clip:text;color:transparent}
  #start p{opacity:.8;letter-spacing:2px;margin:6px 0}
  #frags{position:absolute;top:18px;left:24px;font-size:20px;font-weight:700;letter-spacing:3px;color:#ffd24a}
  #hit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;color:#fff;opacity:0;text-shadow:0 0 10px #f33}
  #wbar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
  .wslot{min-width:92px;padding:6px 10px;border:1px solid #7ffff022;background:#0007;text-align:center;font-weight:700;letter-spacing:2px;font-size:12px;opacity:.55;transition:.12s}
  .wslot b{display:block;font-size:20px;letter-spacing:0}
  .wslot{min-width:64px;opacity:.22;padding:3px 6px !important}
  .wslot.own{opacity:.6}
  .wslot.dry{color:#ff6a5a}
  .wslot i{display:block;font-style:normal;font-size:12px;letter-spacing:1px;min-height:14px;color:#cfe}
  .wslot.on{opacity:1 !important;transform:translateY(-6px);border-color:var(--c);box-shadow:0 0 14px var(--c)}
  kbd{border:1px solid #7ffff055;border-radius:4px;padding:1px 7px;margin:0 2px;background:#0008}
</style>
</head>
<body>
<div id="hud">
  <div id="cross"><i></i><i></i><i></i><i></i><b></b></div>
  <div id="net"></div>
  <div id="medal">FREE-FOR-ALL  ·  PRACTICE</div>
  <div id="msg"></div>
  <div id="frags">FRAGS 0</div>
  <div id="hit">✕</div>
  <div class="stat" id="hp">100<small>HEALTH</small></div>
  <div class="stat" id="ar">0<small>ARMOR</small></div>
  <div id="wbar"></div>
  <div class="stat" id="speed">0<small>UNITS / SEC</small></div>
</div>
<div id="start">
  <h1>MODERNQUAKE</h1>
  <p>CLICK TO PLAY</p>
  <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp; <kbd>SPACE</kbd> jump (tap each hop) &nbsp; <kbd>C</kbd> crouch &nbsp; <kbd>R</kbd> respawn</p>
  <p>Strafe + turn in the air to gain speed. Step on the glowing pads.</p>
  <div id="online"><input id="pname" maxlength="14" placeholder="NAME"><input id="proom" maxlength="12" placeholder="ROOM CODE"><button id="pgo">PLAY ONLINE</button></div>
  <p id="netstat" style="font-size:13px;opacity:.7"></p>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
